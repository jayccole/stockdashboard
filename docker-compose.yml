# Coolify: New Resource -> Docker Compose -> this repo. Coolify reads the ${VARS} below
# and lists them under Environment Variables. Only `web` needs a domain; the API and
# database stay on the internal network.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stocks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stocks}
  WEBULL_APP_KEY: ${WEBULL_APP_KEY}
  WEBULL_APP_SECRET: ${WEBULL_APP_SECRET}
  WEBULL_REGION: ${WEBULL_REGION:-us}
  WEBULL_API_ENDPOINT: ${WEBULL_API_ENDPOINT:-}
  WEBULL_WATCHLISTS: ${WEBULL_WATCHLISTS:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
  QUOTE_INTERVAL_MIN: ${QUOTE_INTERVAL_MIN:-5}
  NIGHTLY_HOUR_ET: ${NIGHTLY_HOUR_ET:-18}
  NIGHTLY_MINUTE_ET: ${NIGHTLY_MINUTE_ET:-30}
  DAILY_BARS_LOOKBACK: ${DAILY_BARS_LOOKBACK:-300}
  ORDER_HISTORY_DAYS: ${ORDER_HISTORY_DAYS:-30}
  DASHBOARD_TOKEN: ${DASHBOARD_TOKEN}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stocks}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocks}"]
      interval: 10s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - webull-token:/data/webull-token
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.scheduler"]
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - webull-token:/data/webull-token
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

volumes:
  pgdata:
  webull-token:
